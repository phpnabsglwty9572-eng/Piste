# Test builds use the shared test bundle. Review uses a different bundle, team, and key.
#
# Test, Pgyer (starts on every push to main):
#   Workflow: Yoohoo Test Pgyer
#   Bundle ID: com.sewhkek.sjdeww
#   Display name in the project: test
#   Developer Portal API key name: cow chat
#   Signing team: 35TUXP935T
#   Secret group: yoohoo_credentials, variable CERTIFICATE_PRIVATE_KEY
#
# Test, App Store Connect upload without review (manual):
#   Workflow: Yoohoo Test App Store Connect
#   submit_to_testflight: false
#
# Review TestFlight (manual). Workflow: Piste
# Bundle ID: com.piste.lifeshare
# Display name: Piste
# Developer Portal API key name: Piste
# Script hardcodes the review bundle, sets YOOHOO_APPSTORE, and refuses the
# test bundle. Fill APP_STORE_APPLE_ID with this Connect App's numeric ID.

workflows:
  yoohoo-ios-pgyer:
    name: Yoohoo Test Pgyer
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "cow chat"
    environment:
      groups:
        - yoohoo_credentials
      vars:
        XCODE_PROJECT: Yoohoo.xcodeproj
        XCODE_SCHEME: Yoohoo
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Use the test bundle ID
        script: |
          sed -i '' -E 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = com.sewhkek.sjdeww;/g' \
            "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          info = Path(os.environ["CM_BUILD_DIR"]) / "Yoohoo" / "Info.plist"
          text = info.read_text()
          text = re.sub(
              r"(<key>CFBundleDisplayName</key>\s*<string>)[^<]+(</string>)",
              r"\1test\2",
              text,
              count=1,
          )
          info.write_text(text)
          PY
      - name: Fetch Ad Hoc signing files
        script: |
          app-store-connect fetch-signing-files "com.sewhkek.sjdeww" \
            --type IOS_APP_ADHOC \
            --create
      - name: Add signing certificate
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Build Ad Hoc IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  yoohoo-ios-app-store:
    name: Yoohoo Test App Store Connect
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "cow chat"
    environment:
      groups:
        - yoohoo_credentials
      vars:
        XCODE_PROJECT: Yoohoo.xcodeproj
        XCODE_SCHEME: Yoohoo
      xcode: latest
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Use the test bundle ID
        script: |
          sed -i '' -E 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = com.sewhkek.sjdeww;/g' \
            "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          info = Path(os.environ["CM_BUILD_DIR"]) / "Yoohoo" / "Info.plist"
          text = info.read_text()
          text = re.sub(
              r"(<key>CFBundleDisplayName</key>\s*<string>)[^<]+(</string>)",
              r"\1test\2",
              text,
              count=1,
          )
          info.write_text(text)
          PY
      - name: Fetch App Store signing files
        script: |
          app-store-connect fetch-signing-files "com.sewhkek.sjdeww" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificate
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Build App Store IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  piste-ios-testflight:
    name: Piste
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Piste
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.piste.lifeshare
      vars:
        XCODE_PROJECT: Yoohoo.xcodeproj
        XCODE_SCHEME: Yoohoo
        APP_STORE_APPLE_ID: "0"
      xcode: latest
    scripts:
      - name: Use the review bundle and App Store compilation flag
        script: |
          set -e
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          bundle = "com.piste.lifeshare"
          root = Path(os.environ["CM_BUILD_DIR"])
          project = root / os.environ["XCODE_PROJECT"] / "project.pbxproj"
          text = project.read_text()
          text = re.sub(r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;", f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};", text)
          text = re.sub(r"\n[ \t]*DEVELOPMENT_TEAM = 35TUXP935T;", "", text)
          parts = text.split("name = Release;")
          if len(parts) < 3:
              raise SystemExit("Could not find the Release target settings")
          middle = parts[1]
          needle = f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};"
          index = middle.rfind(needle)
          if index < 0:
              raise SystemExit("Release bundle identifier was not updated")
          flag = "\n\t\t\t\tSWIFT_ACTIVE_COMPILATION_CONDITIONS = YOOHOO_APPSTORE;"
          if "SWIFT_ACTIVE_COMPILATION_CONDITIONS = YOOHOO_APPSTORE;" not in middle:
              middle = middle[:index + len(needle)] + flag + middle[index + len(needle):]
          updated = "name = Release;".join([parts[0], middle, *parts[2:]])
          if "com.sewhkek.sjdeww" in updated:
              raise SystemExit("Test bundle ID is still in the Xcode project")
          project.write_text(updated)
          info = root / "Yoohoo" / "Info.plist"
          plist = info.read_text()
          plist = re.sub(
              r"(<key>CFBundleDisplayName</key>\s*<string>)[^<]+(</string>)",
              r"\1Piste\2",
              plist,
              count=1,
          )
          info.write_text(plist)
          print("Release bundle ID is", bundle)
          PY

      - name: Enable Sign in with Apple for the review bundle
        script: |
          cat > /tmp/piste-asc.js <<'JS'
          const crypto = require("crypto");
          const fs = require("fs");
          const https = require("https");

          const bundle = "com.piste.lifeshare";

          function b64url(value) {
            return Buffer.from(value)
              .toString("base64")
              .replace(/=/g, "")
              .replace(/\+/g, "-")
              .replace(/\//g, "_");
          }

          function privateKey() {
            let pem = process.env.APP_STORE_CONNECT_PRIVATE_KEY || "";
            const keyPath = process.env.APP_STORE_CONNECT_PRIVATE_KEY_PATH || "";
            if (!pem.includes("BEGIN PRIVATE KEY") && keyPath && fs.existsSync(keyPath)) {
              pem = fs.readFileSync(keyPath, "utf8");
            }
            pem = pem.replace(/\\n/g, "\n").trim();
            if (!pem.includes("BEGIN PRIVATE KEY")) {
              try {
                const decoded = Buffer.from(pem, "base64").toString("utf8");
                if (decoded.includes("BEGIN PRIVATE KEY")) pem = decoded;
              } catch (err) {}
            }
            if (!pem.includes("BEGIN PRIVATE KEY")) {
              throw new Error("App Store Connect private key is missing or not a PEM");
            }
            return pem;
          }

          function token() {
            const issuer = process.env.APP_STORE_CONNECT_ISSUER_ID || "";
            const keyId = process.env.APP_STORE_CONNECT_KEY_IDENTIFIER || "";
            if (!issuer || !keyId) {
              throw new Error("App Store Connect issuer id or key id is missing");
            }
            const now = Math.floor(Date.now() / 1000);
            const header = b64url(JSON.stringify({ alg: "ES256", kid: keyId, typ: "JWT" }));
            const payload = b64url(JSON.stringify({
              iss: issuer,
              iat: now - 30,
              exp: now + 19 * 60,
              aud: "appstoreconnect-v1",
            }));
            const signingInput = `${header}.${payload}`;
            const signature = crypto.sign("sha256", Buffer.from(signingInput), {
              key: privateKey(),
              dsaEncoding: "ieee-p1363",
            });
            if (signature.length !== 64) {
              throw new Error("ES256 signature was not 64 bytes");
            }
            return `${signingInput}.${b64url(signature)}`;
          }

          function api(method, path, body) {
            const jwt = token();
            const payload = body ? JSON.stringify(body) : null;
            return new Promise((resolve, reject) => {
              const req = https.request(
                {
                  method,
                  hostname: "api.appstoreconnect.apple.com",
                  path: "/v1" + path,
                  headers: {
                    Authorization: "Bearer " + jwt,
                    Accept: "application/json",
                    ...(payload ? { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(payload) } : {}),
                  },
                },
                (res) => {
                  const chunks = [];
                  res.on("data", (chunk) => chunks.push(chunk));
                  res.on("end", () => {
                    const raw = Buffer.concat(chunks).toString("utf8");
                    let json = {};
                    if (raw) {
                      try {
                        json = JSON.parse(raw);
                      } catch (err) {
                        json = { raw: raw.slice(0, 2000) };
                      }
                    }
                    resolve({ status: res.statusCode, json });
                  });
                }
              );
              req.on("error", reject);
              if (payload) req.write(payload);
              req.end();
            });
          }

          function fail(message, response) {
            const detail = response ? JSON.stringify(response.json).slice(0, 2000) : "";
            throw new Error(detail ? `${message} (${response.status}): ${detail}` : message);
          }

          async function bundleResourceId() {
            const query = new URLSearchParams({ "filter[identifier]": bundle, limit: "200" }).toString();
            let response = await api("GET", "/bundleIds?" + query);
            if (response.status !== 200) fail("Could not list bundle IDs", response);
            let items = (response.json.data || []).filter((item) => item.attributes && item.attributes.identifier === bundle);
            if (!items.length) {
              response = await api("POST", "/bundleIds", {
                data: {
                  type: "bundleIds",
                  attributes: { identifier: bundle, name: "Piste", platform: "IOS" },
                },
              });
              if (response.status === 201 && response.json.data) return response.json.data.id;
              if (response.status !== 409) fail("Could not create the review bundle ID", response);
              response = await api("GET", "/bundleIds?" + query);
              if (response.status !== 200) fail("Could not list bundle IDs after create", response);
              items = (response.json.data || []).filter((item) => item.attributes && item.attributes.identifier === bundle);
            }
            if (!items.length) throw new Error("Review bundle ID was not found after create");
            return items[0].id;
          }

          async function enableAppleSignIn(resourceId) {
            const listed = await api("GET", `/bundleIds/${resourceId}/bundleIdCapabilities?limit=200`);
            if (listed.status !== 200) fail("Could not list capabilities", listed);
            const enabled = (listed.json.data || []).some((item) => item.attributes && item.attributes.capabilityType === "APPLE_ID_AUTH");
            if (enabled) {
              console.log("APPLE_ID_AUTH already enabled");
              return;
            }
            const variants = [
              { capabilityType: "APPLE_ID_AUTH", settings: [] },
              { capabilityType: "APPLE_ID_AUTH" },
            ];
            let last = null;
            for (const attributes of variants) {
              last = await api("POST", "/bundleIdCapabilities", {
                data: {
                  type: "bundleIdCapabilities",
                  attributes,
                  relationships: { bundleId: { data: { type: "bundleIds", id: resourceId } } },
                },
              });
              if (last.status === 201 || last.status === 409) {
                console.log("Enabled APPLE_ID_AUTH", last.status);
                return;
              }
              if (last.status !== 400 && last.status !== 422) break;
            }
            fail("Could not enable Sign in with Apple. The Piste API key needs Admin access", last);
          }

          async function appStoreProfiles(resourceId) {
            const related = await api("GET", `/bundleIds/${resourceId}/profiles?limit=200`);
            if (related.status === 200) {
              return (related.json.data || []).filter((item) => item.attributes && item.attributes.profileType === "IOS_APP_STORE");
            }
            const listed = await api("GET", "/profiles?filter[profileType]=IOS_APP_STORE&limit=200");
            if (listed.status !== 200) fail("Could not list provisioning profiles", listed);
            const matched = [];
            for (const profile of listed.json.data || []) {
              const owner = await api("GET", `/profiles/${profile.id}/bundleId`);
              if (owner.status === 200 && owner.json.data && owner.json.data.attributes && owner.json.data.attributes.identifier === bundle) {
                matched.push(profile);
              }
            }
            return matched;
          }

          async function deleteAppStoreProfiles(resourceId) {
            const profiles = await appStoreProfiles(resourceId);
            for (const profile of profiles) {
              const deleted = await api("DELETE", `/profiles/${profile.id}`);
              if (deleted.status !== 204 && deleted.status !== 404) fail("Could not delete App Store profile " + profile.id, deleted);
              console.log("Deleted App Store profile", profile.id, deleted.status);
            }
            if (!profiles.length) console.log("No App Store profile to delete");
          }

          async function main() {
            const resourceId = await bundleResourceId();
            console.log("Bundle ID resource", resourceId);
            if (process.argv[2] !== "delete-profiles") await enableAppleSignIn(resourceId);
            await deleteAppStoreProfiles(resourceId);
            console.log("Sign in with Apple is ready for", bundle);
          }

          main().catch((err) => {
            console.error(err.message || String(err));
            process.exit(1);
          });
          JS
          node /tmp/piste-asc.js enable

      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Fetch App Store signing files
        script: |
          set -e
          attempt=1
          while [ "$attempt" -le 3 ]; do
            node /tmp/piste-asc.js delete-profiles
            app-store-connect fetch-signing-files "com.piste.lifeshare" \
              --type IOS_APP_STORE \
              --create
            if python3 - <<'PY'
          import pathlib
          import plistlib
          import subprocess

          bundle = "com.piste.lifeshare"
          roots = [
              pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles",
              pathlib.Path.home() / "Library/MobileDevice/Provisioning Profiles",
          ]
          matched = False
          ready = False
          for root in roots:
              if not root.exists():
                  continue
              for profile in root.glob("*.mobileprovision"):
                  decoded = subprocess.run(["security", "cms", "-D", "-i", str(profile)], capture_output=True)
                  if decoded.returncode != 0:
                      continue
                  plist = plistlib.loads(decoded.stdout)
                  app_id = plist.get("Entitlements", {}).get("application-identifier", "")
                  if not app_id.endswith("." + bundle):
                      continue
                  matched = True
                  if "com.apple.developer.applesignin" in plist.get("Entitlements", {}):
                      ready = True
          if matched and ready:
              print("Release profile includes Sign in with Apple")
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              exit 0
            fi
            echo "Profile is not ready yet, retry ${attempt}"
            attempt=$((attempt + 1))
            sleep 8
          done
          echo "The App Store profile has no Sign in with Apple"
          exit 1

      - name: Add signing certificate
        script: |
          set -e
          keychain add-certificates

      - name: Set up provisioning profiles settings on Xcode project
        script: |
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --archive-method app-store \
            --code-signing-setup-verbose-logging \
            --export-options-plist "$HOME/export_options.plist"

      - name: Increment build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          if [ -n "${APP_STORE_APPLE_ID:-}" ] && [ "$APP_STORE_APPLE_ID" != "0" ]; then
            TF_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
            APP_BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          else
            TF_BUILD=0
            APP_BUILD=0
          fi
          TF_BUILD=${TF_BUILD:-0}
          APP_BUILD=${APP_BUILD:-0}
          if ! [[ "$TF_BUILD" =~ ^[0-9]+$ ]]; then TF_BUILD=0; fi
          if ! [[ "$APP_BUILD" =~ ^[0-9]+$ ]]; then APP_BUILD=0; fi
          LATEST_BUILD_NUMBER=$TF_BUILD
          if [ "$APP_BUILD" -gt "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=$APP_BUILD
          fi
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "TestFlight latest: $TF_BUILD"
          echo "App Store latest: $APP_BUILD"
          echo "Using max: $LATEST_BUILD_NUMBER → next: $NEW_BUILD_NUMBER"
          echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> "$CM_ENV"
          agvtool new-version -all "$NEW_BUILD_NUMBER"
          agvtool what-version -terse

      - name: Confirm review IAP identifiers
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          text = (Path(os.environ["CM_BUILD_DIR"]) / "Yoohoo/App/YoohooSession.swift").read_text()
          start = text.find("#if YOOHOO_APPSTORE")
          catalog = text.find("static var catalog")
          chunk = text[catalog:]
          appstore = chunk.split("#else", 1)[0]
          ids = [
              "ricfnjspieprhkxk",
              "ubailncxfjfeotky",
              "pqyqniwbkwhkritp",
              "btlhbcomllaxhafj",
              "miihbdkruepvdlyo",
              "dtxhgdweskutnqmi",
              "ewfkthoykyblhsvr",
          ]
          missing = [item for item in ids if item not in appstore]
          if missing:
              raise SystemExit("Review IAP IDs missing from YOOHOO_APPSTORE catalog: " + ",".join(missing))
          leak = [item for item in ["6zdz3v2alwput2vo2", "com.sewhkek.sjdeww"] if item in appstore]
          if leak:
              raise SystemExit("Test identifiers leaked into the App Store catalog")
          project = (Path(os.environ["CM_BUILD_DIR"]) / os.environ["XCODE_PROJECT"] / "project.pbxproj").read_text()
          if "SWIFT_ACTIVE_COMPILATION_CONDITIONS = YOOHOO_APPSTORE;" not in project:
              raise SystemExit("YOOHOO_APPSTORE is not on the Release target")
          print("Review IAP IDs ready:", ",".join(ids))
          PY

      - name: Build ipa for distribution
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$NEW_BUILD_NUMBER PRODUCT_BUNDLE_IDENTIFIER=com.piste.lifeshare SWIFT_ACTIVE_COMPILATION_CONDITIONS=YOOHOO_APPSTORE" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - gusttavomacedo@icloud.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
