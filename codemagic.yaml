# Test builds use the shared test bundle. Review uses a different bundle, team, and key.
#
# Test, Pgyer (starts on every push to main):
#   Workflow: Yoohoo Test Pgyer
#   Bundle ID: com.sewhkek.sjdeww
#   Display name in the project: test
#   Developer Portal API key name: cow chat
#   Signing team: 35TUXP935T
#   Secret group: yoohoo_credentials, variable CERTIFICATE_PRIVATE_KEY
#
# Test, App Store Connect upload without review (manual):
#   Workflow: Yoohoo Test App Store Connect
#   submit_to_testflight: false
#
# Review TestFlight (manual). Workflow: Piste
# Bundle ID: com.piste.lifeshare
# Display name: Piste
# Developer Portal API key name: Piste
# Script hardcodes the review bundle, sets YOOHOO_APPSTORE, and refuses the
# test bundle. Fill APP_STORE_APPLE_ID with this Connect App's numeric ID.

workflows:
  yoohoo-ios-pgyer:
    name: Yoohoo Test Pgyer
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "cow chat"
    environment:
      groups:
        - yoohoo_credentials
      vars:
        XCODE_PROJECT: Yoohoo.xcodeproj
        XCODE_SCHEME: Yoohoo
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Use the test bundle ID
        script: |
          sed -i '' -E 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = com.sewhkek.sjdeww;/g' \
            "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          info = Path(os.environ["CM_BUILD_DIR"]) / "Yoohoo" / "Info.plist"
          text = info.read_text()
          text = re.sub(
              r"(<key>CFBundleDisplayName</key>\s*<string>)[^<]+(</string>)",
              r"\1test\2",
              text,
              count=1,
          )
          info.write_text(text)
          PY
      - name: Fetch Ad Hoc signing files
        script: |
          app-store-connect fetch-signing-files "com.sewhkek.sjdeww" \
            --type IOS_APP_ADHOC \
            --create
      - name: Add signing certificate
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Build Ad Hoc IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  yoohoo-ios-app-store:
    name: Yoohoo Test App Store Connect
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "cow chat"
    environment:
      groups:
        - yoohoo_credentials
      vars:
        XCODE_PROJECT: Yoohoo.xcodeproj
        XCODE_SCHEME: Yoohoo
      xcode: latest
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Use the test bundle ID
        script: |
          sed -i '' -E 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = com.sewhkek.sjdeww;/g' \
            "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          info = Path(os.environ["CM_BUILD_DIR"]) / "Yoohoo" / "Info.plist"
          text = info.read_text()
          text = re.sub(
              r"(<key>CFBundleDisplayName</key>\s*<string>)[^<]+(</string>)",
              r"\1test\2",
              text,
              count=1,
          )
          info.write_text(text)
          PY
      - name: Fetch App Store signing files
        script: |
          app-store-connect fetch-signing-files "com.sewhkek.sjdeww" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificate
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Build App Store IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  piste-ios-testflight:
    name: Piste
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Piste
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.piste.lifeshare
      vars:
        XCODE_PROJECT: Yoohoo.xcodeproj
        XCODE_SCHEME: Yoohoo
        APP_STORE_APPLE_ID: "0"
      xcode: latest
    scripts:
      - name: Use the review bundle and App Store compilation flag
        script: |
          set -e
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          bundle = "com.piste.lifeshare"
          root = Path(os.environ["CM_BUILD_DIR"])
          project = root / os.environ["XCODE_PROJECT"] / "project.pbxproj"
          text = project.read_text()
          text = re.sub(r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;", f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};", text)
          text = re.sub(r"\n[ \t]*DEVELOPMENT_TEAM = 35TUXP935T;", "", text)
          parts = text.split("name = Release;")
          if len(parts) < 3:
              raise SystemExit("Could not find the Release target settings")
          middle = parts[1]
          needle = f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};"
          index = middle.rfind(needle)
          if index < 0:
              raise SystemExit("Release bundle identifier was not updated")
          flag = "\n\t\t\t\tSWIFT_ACTIVE_COMPILATION_CONDITIONS = YOOHOO_APPSTORE;"
          if "SWIFT_ACTIVE_COMPILATION_CONDITIONS = YOOHOO_APPSTORE;" not in middle:
              middle = middle[:index + len(needle)] + flag + middle[index + len(needle):]
          updated = "name = Release;".join([parts[0], middle, *parts[2:]])
          if "com.sewhkek.sjdeww" in updated:
              raise SystemExit("Test bundle ID is still in the Xcode project")
          project.write_text(updated)
          info = root / "Yoohoo" / "Info.plist"
          plist = info.read_text()
          plist = re.sub(
              r"(<key>CFBundleDisplayName</key>\s*<string>)[^<]+(</string>)",
              r"\1Piste\2",
              plist,
              count=1,
          )
          info.write_text(plist)
          print("Release bundle ID is", bundle)
          PY

      - name: Enable Sign in with Apple for the review bundle
        script: |
          python3 - <<'PY'
          import json
          import subprocess

          bundle = "com.piste.lifeshare"

          def run(args):
              result = subprocess.run(["app-store-connect", "--json", *args], capture_output=True, text=True)
              if result.returncode != 0:
                  raise SystemExit(result.stderr.strip() or result.stdout.strip() or "App Store Connect request failed")
              text = result.stdout.strip()
              if not text:
                  return []
              try:
                  data = json.loads(text)
              except json.JSONDecodeError:
                  data = [json.loads(line) for line in text.splitlines() if line.strip()[:1] in "{["]
              if isinstance(data, dict):
                  data = data.get("data", [data])
              return data

          bundles = run([
              "bundle-ids", "list",
              "--bundle-id-identifier", bundle,
              "--platform", "IOS",
              "--strict-match-identifier",
          ])
          bundles = [item for item in bundles if item.get("attributes", {}).get("identifier") == bundle]
          if not bundles:
              created = run(["bundle-ids", "create", bundle, "--platform", "IOS", "--name", "Piste"])
              bundles = created if isinstance(created, list) else [created]
          bundle_resource_id = bundles[0]["id"]
          capabilities = run(["bundle-ids", "capabilities", bundle_resource_id])
          enabled = {item.get("attributes", {}).get("capabilityType") for item in capabilities}
          if "APPLE_ID_AUTH" not in enabled:
              subprocess.run(
                  ["app-store-connect", "bundle-ids", "enable-capabilities", bundle_resource_id, "--capability", "Sign In with Apple"],
                  check=True,
              )
          profiles = run([
              "bundle-ids", "profiles",
              "--bundle-ids", bundle_resource_id,
              "--type", "IOS_APP_STORE",
          ])
          for profile in profiles:
              subprocess.run(
                  ["app-store-connect", "profiles", "delete", profile["id"], "--ignore-not-found"],
                  check=True,
              )
          print("Sign in with Apple is enabled for", bundle)
          PY

      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Fetch App Store signing files
        script: |
          set -e
          app-store-connect fetch-signing-files "com.piste.lifeshare" \
            --type IOS_APP_STORE \
            --create
          python3 - <<'PY'
          import pathlib
          import plistlib
          import subprocess

          bundle = "com.piste.lifeshare"
          roots = [
              pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles",
              pathlib.Path.home() / "Library/MobileDevice/Provisioning Profiles",
          ]
          matched = False
          for root in roots:
              for profile in root.glob("*.mobileprovision"):
                  decoded = subprocess.run(["security", "cms", "-D", "-i", str(profile)], capture_output=True, check=True)
                  plist = plistlib.loads(decoded.stdout)
                  app_id = plist.get("Entitlements", {}).get("application-identifier", "")
                  if not app_id.endswith(bundle):
                      continue
                  matched = True
                  if "com.apple.developer.applesignin" not in plist.get("Entitlements", {}):
                      raise SystemExit("The App Store profile has no Sign in with Apple")
          if not matched:
              raise SystemExit("No App Store profile for the review bundle was downloaded")
          print("Release profile includes Sign in with Apple")
          PY

      - name: Add signing certificate
        script: |
          set -e
          keychain add-certificates

      - name: Set up provisioning profiles settings on Xcode project
        script: |
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --archive-method app-store \
            --code-signing-setup-verbose-logging \
            --export-options-plist "$HOME/export_options.plist"

      - name: Increment build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          TF_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          APP_BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          TF_BUILD=${TF_BUILD:-0}
          APP_BUILD=${APP_BUILD:-0}
          if ! [[ "$TF_BUILD" =~ ^[0-9]+$ ]]; then TF_BUILD=0; fi
          if ! [[ "$APP_BUILD" =~ ^[0-9]+$ ]]; then APP_BUILD=0; fi
          LATEST_BUILD_NUMBER=$TF_BUILD
          if [ "$APP_BUILD" -gt "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=$APP_BUILD
          fi
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "TestFlight latest: $TF_BUILD"
          echo "App Store latest: $APP_BUILD"
          echo "Using max: $LATEST_BUILD_NUMBER → next: $NEW_BUILD_NUMBER"
          echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> "$CM_ENV"
          agvtool new-version -all "$NEW_BUILD_NUMBER"
          agvtool what-version -terse

      - name: Confirm review IAP identifiers
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os
          text = (Path(os.environ["CM_BUILD_DIR"]) / "Yoohoo/App/YoohooSession.swift").read_text()
          start = text.find("#if YOOHOO_APPSTORE")
          catalog = text.find("static var catalog")
          chunk = text[catalog:]
          appstore = chunk.split("#else", 1)[0]
          ids = [
              "ricfnjspieprhkxk",
              "ubailncxfjfeotky",
              "pqyqniwbkwhkritp",
              "btlhbcomllaxhafj",
              "miihbdkruepvdlyo",
              "dtxhgdweskutnqmi",
              "ewfkthoykyblhsvr",
          ]
          missing = [item for item in ids if item not in appstore]
          if missing:
              raise SystemExit("Review IAP IDs missing from YOOHOO_APPSTORE catalog: " + ",".join(missing))
          leak = [item for item in ["6zdz3v2alwput2vo2", "com.sewhkek.sjdeww"] if item in appstore]
          if leak:
              raise SystemExit("Test identifiers leaked into the App Store catalog")
          project = (Path(os.environ["CM_BUILD_DIR"]) / os.environ["XCODE_PROJECT"] / "project.pbxproj").read_text()
          if "SWIFT_ACTIVE_COMPILATION_CONDITIONS = YOOHOO_APPSTORE;" not in project:
              raise SystemExit("YOOHOO_APPSTORE is not on the Release target")
          print("Review IAP IDs ready:", ",".join(ids))
          PY

      - name: Build ipa for distribution
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$NEW_BUILD_NUMBER PRODUCT_BUNDLE_IDENTIFIER=com.piste.lifeshare SWIFT_ACTIVE_COMPILATION_CONDITIONS=YOOHOO_APPSTORE" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - gusttavomacedo@icloud.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
